{% extends 'base.html' %}
{% block title %}Acceso{% endblock %}
{% block content %}
<div class="login-wrap"><section class="card login-card" aria-labelledby="login-title">
<h1 id="login-title">Acceso a la junta</h1><p class="small muted">PULSO NEXUS CORE v1.0</p>
{% if error %}<div class="notice err" role="alert"><span class="icon">!</span><p>{{ error }}</p></div>{% endif %}
<form method="post" action="{{ url_for('login_post') }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label class="field">Usuario<input type="text" name="username" autocomplete="username" required autofocus></label>
<label class="field">Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">Entrar</button></form>
</section></div>
{% endblock %}
