{% extends 'base.html' %}{% block content %}
<h2>Acceso</h2>{% if error %}<p class="banner err">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login_post') }}" class="card" style="max-width:360px">
<input type="hidden" name="csrf" value="{{ csrf }}">
<p><label>Usuario<br><input name="username" autocomplete="username" required></label></p>
<p><label>Contraseña<br><input name="password" type="password" autocomplete="current-password" required></label></p>
<button type="submit">Entrar</button></form>{% endblock %}
