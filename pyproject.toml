[project]
name = "pulso-nexus"
version = "0.1.0a1"
description = "PULSO NEXUS — núcleo reproducible E1-A + metadatos SQL Server E1-B (datos sintéticos)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pyarrow>=18",
    # E1-B: driver ODBC solo para nexus.metadata (import-linter + prueba AST lo imponen).
    "pyodbc>=5.1",
]

[project.scripts]
nexus = "nexus.cli:main"

[project.optional-dependencies]
web = [
    "flask>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
    "flask>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.wheel.force-include]
"src/nexus/connectors/allowlist.toml" = "nexus/connectors/allowlist.toml"
"src/nexus/contracts/fingerprints.json" = "nexus/contracts/fingerprints.json"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # funciones con muchos parámetros explícitos son intencionales en el CLI
    "PLR0917",  # el contrato del repositorio de metadatos usa parámetros posicionales explícitos
    "PLR2004",  # constantes mágicas en tests y validaciones
    "PLR0911",
    "PLR0912",
    "S603",     # subprocess sin shell, con argumentos controlados
    "S607",
    "RUF001",   # caracteres Unicode intencionales (pruebas NFC)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLC0415", "S311", "S103"]  # S103: árboles permisivos intencionados en sondas
"scripts/**" = ["S311"]
"tests/sql/**" = ["E501", "RUF043", "F401", "F811", "S101", "S108", "PLC0415", "S603", "S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pyodbc"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Un hilo que muere con una excepción no capturada invalida la prueba (p. ej., un
# atacante concurrente que deja de atacar): se trata como error, no como aviso.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "sql: requiere SQL Server efímero real (job SQL de CI); se deselecciona con -m 'not sql'",
    "posix_only: garantía demostrada solo en POSIX; en Windows queda pendiente de certificar",
]

[tool.coverage.run]
branch = true
source = ["nexus"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# El código exclusivo de Windows no puede ejecutarse en Linux. Se excluye del umbral de
# Linux (A13) de forma explícita y declarada, y se ejecuta en el job de Windows de CI.
exclude_also = [
    'if sys\.platform == "win32":',
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "nexus"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "E1-B: solo nexus.metadata importa pyodbc"
type = "forbidden"
source_modules = [
    "nexus.cli", "nexus.connectors", "nexus.contracts", "nexus.engines", "nexus.errors",
    "nexus.hashing", "nexus.normalize", "nexus.pipeline", "nexus.sealed", "nexus.snapshots",
    "nexus.storage", "nexus.core", "nexus.web",
]
forbidden_modules = ["pyodbc"]
allow_indirect_imports = true  # la regla es sobre imports DIRECTOS; el CLI usa metadata

[[tool.importlinter.contracts]]
name = "E1-B: metadata no depende de capas de datos ni del pipeline"
type = "forbidden"
source_modules = ["nexus.metadata"]
forbidden_modules = [
    "nexus.pipeline", "nexus.storage", "nexus.snapshots", "nexus.normalize", "nexus.engines",
    "nexus.connectors", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "engines: sin dependencias de E/S internas"
type = "forbidden"
source_modules = ["nexus.engines"]
forbidden_modules = [
    "nexus.connectors", "nexus.storage", "nexus.pipeline",
    "nexus.snapshots", "nexus.normalize", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "normalize: puro, sin E/S interna"
type = "forbidden"
source_modules = ["nexus.normalize"]
forbidden_modules = [
    "nexus.connectors", "nexus.storage", "nexus.pipeline",
    "nexus.snapshots", "nexus.engines", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "contracts: base sin dependencias de capas superiores"
type = "forbidden"
source_modules = ["nexus.contracts", "nexus.hashing", "nexus.errors"]
forbidden_modules = [
    "nexus.connectors", "nexus.storage", "nexus.pipeline", "nexus.snapshots",
    "nexus.normalize", "nexus.engines", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "connectors: transporte sin reglas ni integración"
type = "forbidden"
source_modules = ["nexus.connectors"]
forbidden_modules = [
    "nexus.normalize", "nexus.engines", "nexus.pipeline", "nexus.storage",
    "nexus.snapshots", "nexus.contracts", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "storage y snapshots: sin lógica de datos"
type = "forbidden"
source_modules = ["nexus.storage", "nexus.snapshots"]
forbidden_modules = [
    "nexus.normalize", "nexus.engines", "nexus.pipeline", "nexus.contracts", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "pipeline no depende del CLI"
type = "forbidden"
source_modules = ["nexus.pipeline"]
forbidden_modules = ["nexus.cli"]

[[tool.importlinter.contracts]]
name = "CORE C4: el cálculo de cobertura es puro (sin E/S, sin estado, sin CS, sin web)"
type = "forbidden"
source_modules = ["nexus.core.coverage", "nexus.core.rules"]
forbidden_modules = [
    "nexus.storage", "nexus.metadata", "nexus.pipeline", "nexus.web", "nexus.core.state",
    "nexus.core.refresh", "nexus.core.cs", "nexus.core.read", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "CORE C7: Frozen, Refresh, publicación y lectura no conocen las notas CS"
type = "forbidden"
source_modules = [
    "nexus.core.refresh", "nexus.core.state", "nexus.core.coverage", "nexus.core.sources",
    "nexus.core.read", "nexus.core.demo",
]
forbidden_modules = ["nexus.core.cs", "nexus.web"]

[[tool.importlinter.contracts]]
name = "CORE C6: la web solo lee lo publicado (no importa cálculo, adaptadores ni motores)"
type = "forbidden"
source_modules = ["nexus.web"]
forbidden_modules = [
    "nexus.core.coverage", "nexus.core.sources", "nexus.planning", "nexus.engines",
    "nexus.normalize", "nexus.connectors", "nexus.pipeline", "nexus.metadata",
]
allow_indirect_imports = true  # la web usa RefreshService/PublishedReader como fachada

[[tool.importlinter.contracts]]
name = "CORE B0-7: el calendario operativo es puro (sin E/S, estado, cálculo ni web)"
type = "forbidden"
source_modules = ["nexus.core.timebase"]
forbidden_modules = [
    "nexus.storage", "nexus.metadata", "nexus.pipeline", "nexus.web", "nexus.core.state",
    "nexus.core.refresh", "nexus.core.cs", "nexus.core.coverage", "nexus.core.read", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "CORE Δ1: los lectores físicos son puros (bytes → registros; sin E/S, estado ni web)"
type = "forbidden"
source_modules = ["nexus.core.physical"]
forbidden_modules = [
    "nexus.storage", "nexus.metadata", "nexus.pipeline", "nexus.web", "nexus.core.state",
    "nexus.core.refresh", "nexus.core.cs", "nexus.core.coverage", "nexus.core.read",
    "nexus.core.stage", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "CORE Δ2: probe/stage no calculan, no publican y no conocen CS ni la web"
type = "forbidden"
source_modules = ["nexus.core.stage"]
forbidden_modules = [
    "nexus.core.refresh", "nexus.core.state", "nexus.core.coverage", "nexus.core.cs",
    "nexus.core.read", "nexus.web", "nexus.pipeline", "nexus.metadata", "nexus.storage",
]
