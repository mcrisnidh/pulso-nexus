[project]
name = "pulso-nexus"
version = "0.1.0a1"
description = "PULSO NEXUS — núcleo reproducible E1-A (sin SQL, datos sintéticos)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pyarrow>=18",
]

[project.scripts]
nexus = "nexus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.wheel.force-include]
"src/nexus/connectors/allowlist.toml" = "nexus/connectors/allowlist.toml"
"src/nexus/contracts/fingerprints.json" = "nexus/contracts/fingerprints.json"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # funciones con muchos parámetros explícitos son intencionales en el CLI
    "PLR2004",  # constantes mágicas en tests y validaciones
    "PLR0911",
    "PLR0912",
    "S603",     # subprocess sin shell, con argumentos controlados
    "S607",
    "RUF001",   # caracteres Unicode intencionales (pruebas NFC)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLC0415", "S311"]
"scripts/**" = ["S311"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Un hilo que muere con una excepción no capturada invalida la prueba (p. ej., un
# atacante concurrente que deja de atacar): se trata como error, no como aviso.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "posix_only: garantía demostrada solo en POSIX; en Windows queda pendiente de certificar",
]

[tool.coverage.run]
branch = true
source = ["nexus"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# El código exclusivo de Windows no puede ejecutarse en Linux. Se excluye del umbral de
# Linux (A13) de forma explícita y declarada, y se ejecuta en el job de Windows de CI.
exclude_also = [
    'if sys\.platform == "win32":',
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "nexus"

[[tool.importlinter.contracts]]
name = "engines: sin dependencias de E/S internas"
type = "forbidden"
source_modules = ["nexus.engines"]
forbidden_modules = [
    "nexus.connectors", "nexus.storage", "nexus.pipeline",
    "nexus.snapshots", "nexus.normalize", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "normalize: puro, sin E/S interna"
type = "forbidden"
source_modules = ["nexus.normalize"]
forbidden_modules = [
    "nexus.connectors", "nexus.storage", "nexus.pipeline",
    "nexus.snapshots", "nexus.engines", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "contracts: base sin dependencias de capas superiores"
type = "forbidden"
source_modules = ["nexus.contracts", "nexus.hashing", "nexus.errors"]
forbidden_modules = [
    "nexus.connectors", "nexus.storage", "nexus.pipeline", "nexus.snapshots",
    "nexus.normalize", "nexus.engines", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "connectors: transporte sin reglas ni integración"
type = "forbidden"
source_modules = ["nexus.connectors"]
forbidden_modules = [
    "nexus.normalize", "nexus.engines", "nexus.pipeline", "nexus.storage",
    "nexus.snapshots", "nexus.contracts", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "storage y snapshots: sin lógica de datos"
type = "forbidden"
source_modules = ["nexus.storage", "nexus.snapshots"]
forbidden_modules = [
    "nexus.normalize", "nexus.engines", "nexus.pipeline", "nexus.contracts", "nexus.cli",
]

[[tool.importlinter.contracts]]
name = "pipeline no depende del CLI"
type = "forbidden"
source_modules = ["nexus.pipeline"]
forbidden_modules = ["nexus.cli"]
